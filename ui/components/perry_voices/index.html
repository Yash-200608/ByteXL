<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
const send = (type, extra) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*");
const synth = window.parent.speechSynthesis || window.speechSynthesis;
let sent = "";

function report() {
  if (!synth) { return; }
  const voices = synth.getVoices().map(v => ({ name: v.name, lang: (v.lang || "").replace("_", "-"), local: !!v.localService, default: !!v.default }));
  const key = JSON.stringify(voices);
  if (!voices.length || key === sent) { return; }
  sent = key;
  send("streamlit:setComponentValue", { value: voices, dataType: "json" });
}

window.addEventListener("message", (event) => {
  if ((event.data || {}).type === "streamlit:render") { report(); }
});
if (synth) { synth.addEventListener("voiceschanged", report); }
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 0 });
setTimeout(report, 300);
setTimeout(report, 1500);
</script>
</body>
</html>
